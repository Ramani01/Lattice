[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-capstone"
version = "1.0.0"
description = "Lattice Enterprise Microservice Dependency & Migration Planning Platform"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "neo4j>=5.0.0",
    "pyyaml>=6.0",
    "tabulate>=0.9.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "langgraph>=0.0.10",
    "langchain-core>=0.1.0",
    "langchain-community>=0.0.10",
    "requests>=2.31.0",
    "streamlit>=1.30.0",
    "boto3>=1.34.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["graph*", "discovery*", "planning*", "gitops*", "utils*"]
