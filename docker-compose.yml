version: '3.8'

services:
  # Base Infrastructure Database Container
  neo4j:
    image: neo4j:5-community
    container_name: lattica-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password

  # Static Local Container Infrastructure (Discovered via Docker Compose Parser)
  user-db:
    image: postgres:15-alpine
    container_name: user-db

  catalog-db:
    image: mongo:6-alpine
    container_name: catalog-db

  order-db:
    image: postgres:15-alpine
    container_name: order-db

  cart-cache:
    image: redis:7-alpine
    container_name: cart-cache

  user-service:
    image: alpine:latest
    container_name: user-service
    depends_on:
      - user-db

  auth-service:
    image: alpine:latest
    container_name: auth-service
    depends_on:
      - user-service

  catalog-service:
    image: alpine:latest
    container_name: catalog-service
    depends_on:
      - catalog-db

  cart-service:
    image: alpine:latest
    container_name: cart-service
    depends_on:
      - cart-cache
      - catalog-service

  order-service:
    image: alpine:latest
    container_name: order-service
    depends_on:
      - auth-service
      - catalog-service
      - order-db

  mobile-bff:
    image: alpine:latest
    container_name: mobile-bff
    depends_on:
      - catalog-service
      - cart-service
      - order-service

  web-bff:
    image: alpine:latest
    container_name: web-bff
    depends_on:
      - catalog-service
      - cart-service
      - order-service
      - user-service

  api-gateway:
    image: alpine:latest
    container_name: api-gateway
    depends_on:
      - auth-service
      - mobile-bff
      - web-bff
