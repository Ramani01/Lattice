version: '3.8'

services:
  neo4j:
    image: neo4j:5-community
    container_name: lattica-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Mock Databases (Callees - Leaves)
  user-db:
    image: alpine:latest
    container_name: lattica-user-db
    command: sleep infinity

  order-db:
    image: alpine:latest
    container_name: lattica-order-db
    command: sleep infinity

  payment-db:
    image: alpine:latest
    container_name: lattica-payment-db
    command: sleep infinity

  # Mock Intermediate Services
  auth-service:
    image: alpine:latest
    container_name: lattica-auth-service
    command: sleep infinity
    depends_on:
      - user-db

  payment-service:
    image: alpine:latest
    container_name: lattica-payment-service
    command: sleep infinity
    depends_on:
      - payment-db

  order-service:
    image: alpine:latest
    container_name: lattica-order-service
    command: sleep infinity
    depends_on:
      - auth-service
      - payment-service
      - order-db

  # Mock Gateway (Root - Caller)
  edge-gateway:
    image: alpine:latest
    container_name: lattica-edge-gateway
    command: sleep infinity
    depends_on:
      - auth-service
      - order-service
