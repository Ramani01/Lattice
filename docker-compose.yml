version: '3.8'

services:
  # Base Infrastructure
  neo4j:
    image: neo4j:5-community
    container_name: lattica-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password

  # Tier 4: Database & Cache Leaves (Phase 1 Upgrades)
  user-db:
    image: postgres:15-alpine
    container_name: user-db

  catalog-db:
    image: mongo:6-alpine
    container_name: catalog-db

  order-db:
    image: postgres:15-alpine
    container_name: order-db

  payment-db:
    image: mysql:8-alpine
    container_name: payment-db

  inventory-db:
    image: postgres:15-alpine
    container_name: inventory-db

  cart-cache:
    image: redis:7-alpine
    container_name: cart-cache

  # Tier 3: Core Domain Services & Cyclic Loops (Tarjan SCC Demonstration)
  # [CYCLE 1]: auth-service <--> user-service (2-Node Cyclic Loop)
  user-service:
    image: alpine:latest
    container_name: user-service
    depends_on:
      - user-db
      - auth-service

  auth-service:
    image: alpine:latest
    container_name: auth-service
    depends_on:
      - user-service

  catalog-service:
    image: alpine:latest
    container_name: catalog-service
    depends_on:
      - catalog-db

  cart-service:
    image: alpine:latest
    container_name: cart-service
    depends_on:
      - cart-cache
      - catalog-service

  # [CYCLE 2]: order-service -> inventory-service -> warehouse-service -> order-service (3-Node Cyclic Loop)
  inventory-service:
    image: alpine:latest
    container_name: inventory-service
    depends_on:
      - inventory-db
      - warehouse-service

  warehouse-service:
    image: alpine:latest
    container_name: warehouse-service
    depends_on:
      - order-service

  payment-service:
    image: alpine:latest
    container_name: payment-service
    depends_on:
      - payment-db
      - notification-service

  notification-service:
    image: alpine:latest
    container_name: notification-service
    depends_on:
      - user-service

  # [SELF LOOP]: reconciliation-service -> reconciliation-service
  reconciliation-service:
    image: alpine:latest
    container_name: reconciliation-service
    depends_on:
      - payment-db
      - order-db
      - reconciliation-service

  # Tier 2: Business Orchestration & Analytics
  order-service:
    image: alpine:latest
    container_name: order-service
    depends_on:
      - auth-service
      - payment-service
      - catalog-service
      - inventory-service
      - order-db
      - notification-service

  analytics-service:
    image: alpine:latest
    container_name: analytics-service
    depends_on:
      - order-db
      - payment-db
      - user-db

  recommendation-service:
    image: alpine:latest
    container_name: recommendation-service
    depends_on:
      - catalog-service
      - analytics-service

  # Tier 1: Gateways & BFFs
  mobile-bff:
    image: alpine:latest
    container_name: mobile-bff
    depends_on:
      - catalog-service
      - cart-service
      - order-service
      - recommendation-service

  web-bff:
    image: alpine:latest
    container_name: web-bff
    depends_on:
      - catalog-service
      - cart-service
      - order-service
      - user-service
      - recommendation-service

  admin-portal:
    image: alpine:latest
    container_name: admin-portal
    depends_on:
      - analytics-service
      - reconciliation-service
      - user-service

  api-gateway:
    image: alpine:latest
    container_name: api-gateway
    depends_on:
      - auth-service
      - mobile-bff
      - web-bff
      - admin-portal
